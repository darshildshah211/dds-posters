<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex Serif;src:url(fonts/ibm-plex-serif-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Plex Serif;src:url(fonts/ibm-plex-serif-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Plex Serif;src:url(fonts/ibm-plex-serif-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Plex Serif;src:url(fonts/ibm-plex-serif-latin-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:Plex Serif;src:url(fonts/ibm-plex-serif-latin-600-italic.woff2);font-weight:600;font-style:italic}
@font-face{font-family:Plex Mono;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Plex Mono;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2);font-weight:500}
:root{--gold:#0e9f6e;--gold2:#0e9f6e;--red:#e02f44;--green:#0e9f6e;--ink:#101114;--mute:#7b7d84}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fbfaf7}
#stage{position:absolute;inset:0;background:radial-gradient(1200px 1000px at 50% 40%,#ffffff 0%,#f8f7f2 60%,#efede6 100%);color:var(--ink);font-family:Inter,sans-serif}
.abs{position:absolute}
.mono{font-family:Plex Mono,monospace}
.serif{font-family:Plex Serif,serif}
#grain{display:none}
#wm{left:0;right:0;top:92px;text-align:center;font-size:24px;letter-spacing:.42em;color:var(--gold);font-weight:500}
#wm .rule{display:block;width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto 0}
.hook{left:80px;right:80px;text-align:center;font-family:Plex Serif,serif}
#h1{top:720px;font-size:46px;color:var(--mute);letter-spacing:.02em}
#h2{top:800px;font-size:92px;font-style:italic;font-weight:400;line-height:1.08;color:var(--ink)}
#h2 em{color:var(--gold2);font-style:italic}
#hdr{left:80px;right:80px;top:210px}
#inst{font-family:Plex Serif,serif;font-size:76px;font-weight:600;letter-spacing:-.01em}
#inst span{color:var(--gold2)}
#sub{margin-top:14px;font-size:26px;color:var(--mute);letter-spacing:.08em}
#clock{position:absolute;right:0;top:12px;text-align:right;font-size:28px;color:var(--mute)}
#clock b{display:block;font-size:52px;color:var(--ink);font-weight:500;letter-spacing:.02em}
#px{left:80px;top:410px}
#pxv{font-family:Plex Serif,serif;font-size:170px;font-weight:600;line-height:1;letter-spacing:-.02em}
#pxc{margin-top:18px;font-size:34px;color:var(--red);letter-spacing:.04em}
#chartwrap{left:0;top:700px;width:1080px;height:860px}
#cv{position:absolute;left:0;top:0}
#ann{left:80px;right:80px;top:1610px;text-align:center;font-family:Plex Serif,serif;font-style:italic;font-size:44px;color:var(--ink)}
#dim{position:absolute;inset:0;background:#fbfaf7}
#rev{left:0;right:0;top:560px;text-align:center}
#revk{font-size:28px;letter-spacing:.32em;color:#e02f44}
#big{font-family:Plex Serif,serif;font-weight:700;font-size:330px;line-height:1;margin-top:30px;background:linear-gradient(180deg,#ff5a6c 0%,#e02f44 50%,#9e1426 100%);-webkit-background-clip:text;color:transparent;letter-spacing:-.03em}
#fromto{margin-top:40px;font-size:54px;font-family:Plex Mono,monospace;color:var(--ink)}
#fromto .a{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px}
#fromto .arrow{color:#101114;margin:0 22px}
#dur{margin-top:28px;font-size:34px;color:var(--mute);font-family:Plex Serif,serif;font-style:italic}
.line{left:90px;right:90px;text-align:center;font-family:Plex Serif,serif}
#l1{top:640px;font-size:66px;color:var(--mute);line-height:1.2}
#l2{top:820px;font-size:88px;font-weight:600;line-height:1.12}
#l2 em{font-style:italic;color:var(--gold2);font-weight:600}
#l3{top:1130px;font-size:40px;color:var(--mute);font-style:italic;line-height:1.35}
#end{left:0;right:0;top:640px;text-align:center}
#endmark{font-family:Plex Serif,serif;font-size:96px;font-weight:600;letter-spacing:.06em;color:#101114}
#endsub{font-size:26px;letter-spacing:.5em;color:var(--gold);margin-top:16px}
#endrule{width:0;height:4px;margin:70px auto;background:linear-gradient(90deg,#e02f44 0 50%,#0e9f6e 50% 100%);border-radius:2px}
#endtag{font-family:Plex Serif,serif;font-style:italic;font-size:58px}
#endcta{margin-top:40px;font-family:Plex Serif,serif;font-style:italic;font-size:36px;color:var(--mute)}
#disc{left:70px;right:70px;bottom:120px;text-align:center;font-size:21px;line-height:1.55;color:#8b8d93}
#bull{inset:0}
#bwash{position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,159,110,.22) 0%,rgba(14,159,110,.06) 45%,rgba(251,250,247,0) 75%)}
#barrow{position:absolute;left:0;top:0}
#bk{position:absolute;left:0;right:0;top:420px;text-align:center;font-size:30px;letter-spacing:.34em;color:#0e9f6e;font-weight:500}
#bt{position:absolute;left:0;right:0;top:500px;text-align:center;font-family:Plex Serif,serif;font-weight:700;font-size:150px;line-height:1.02;color:#101114;letter-spacing:-.02em}
#bt em{color:#0e9f6e;font-style:italic}
#bs{position:absolute;left:0;right:0;top:850px;text-align:center;font-family:Plex Serif,serif;font-style:italic;font-size:46px;color:#7b7d84}
#bbg{position:absolute;inset:0}
</style></head>
<body><div id="stage">
<div id="wm" class="abs mono">DDS CAPITAL WEALTH<span class="rule"></span></div>

<div id="h1" class="abs hook"></div>
<div id="h2" class="abs hook"></div>

<div id="hdr" class="abs">
  <div id="inst"></div>
  <div id="sub" class="mono"></div>
  <div id="clock" class="mono">IST<b id="clk">09:15</b></div>
</div>
<div id="px" class="abs">
  <div id="pxv">₹142.85</div>
  <div id="pxc" class="mono">−0.00 · −0.0% since 9:17</div>
</div>
<div id="chartwrap" class="abs"><canvas id="cv" width="1080" height="860"></canvas></div>
<div id="ann" class="abs"></div>

<div id="bull" class="abs"><div id="bwash"></div><svg id="barrow" width="1080" height="1920" viewBox="0 0 1080 1920"><path id="bpath" d="M60 1560 L300 1380 L420 1450 L640 1170 L760 1240 L1010 900" fill="none" stroke="#0e9f6e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path id="bhead" d="M935 905 L1010 900 L1000 975" fill="none" stroke="#0e9f6e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div id="bk" class="mono"></div><div id="bt"></div><div id="bs"></div></div>
<div id="dim"></div>
<div id="rev" class="abs">
  <div id="revk" class="mono">PREMIUM ERASED</div>
  <div id="big">−56%</div>
  <div id="fromto"></div>
  <div id="dur">in a single session</div>
</div>
<div id="l1" class="abs line">Emotions chase<br>the move.</div>
<div id="l2" class="abs line">Rules respect<br><em>the clock.</em></div>
<div id="l3" class="abs line">Systematic, rule-based execution.<br>Ask us how it works.</div>

<div id="end" class="abs">
  <div id="endmark">DDS CAPITAL</div>
  <div id="endsub" class="mono">WEALTH</div>
  <div id="endrule"></div>
  <div id="endtag">Rules over emotions.</div>
  <div id="endcta">To know more, contact us.</div>
</div>
<div id="disc" class="abs"></div>
<canvas id="grain" width="540" height="960"></canvas>
</div>
<script>
// ---------- data (injected as window.DATA) ----------
const D=window.DATA;
const M=D.minutes.map(k=>({o:k[0],h:k[1],l:k[2],c:k[3]}));
const N=M.length;
const [hh,mm]=D.first_time.split(':').map(Number);const T0=hh*60+mm;
const REF=D.open;
const BIN=N>200?5:3;
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eout=x=>1-Math.pow(1-cl(x),3);
function win(t,a,b,fi=.5,fo=.5){if(t<a||t>b)return 0;return Math.min(eout((t-a)/fi),fo>0?eout((b-t)/fo):1)}
function set(id,op,ty=0,sc=1,blur=0){const e=$(id);e.style.opacity=op;e.style.transform=`translateY(${ty}px) scale(${sc})`;e.style.filter=blur?`blur(${blur}px)`:'none';e.style.visibility=op<=0.001?'hidden':'visible'}
const fmt=v=>v.toFixed(2);
// ---------- chart ----------
const cv=$('cv'),ctx=cv.getContext('2d');
const L=70,R=900,TOP=40,BOT=800;
const lo=Math.min(...M.map(k=>k.l)),hi=Math.max(...M.map(k=>k.h));
const STEP=[1,2,5,10,20,25,50,100,200].find(v=>(hi-lo)/v<=6)||500;
const PMIN=Math.floor((lo-(hi-lo)*.06)/STEP)*STEP,PMAX=Math.ceil((hi+(hi-lo)*.06)/STEP)*STEP;
const yOf=p=>BOT-(p-PMIN)/(PMAX-PMIN)*(BOT-TOP);
const NB=Math.ceil(N/BIN), SP=(R-L)/NB, BW=SP*0.62;
function candlesAt(mf){ // mf = minutes elapsed (float)
  const done=Math.floor(mf), part=mf-done, out=[];
  for(let b=0;b<NB;b++){
    const s=b*BIN; if(s>mf)break;
    let o=M[s].o,h=-1e9,l=1e9,c=o;
    for(let i=s;i<Math.min(s+BIN,N);i++){
      if(i<done){h=Math.max(h,M[i].h);l=Math.min(l,M[i].l);c=M[i].c}
      else if(i===done&&i<N){ // forming minute: wiggle through o->h->l->c
        const k=M[i];const pts=[k.o,k.h,k.l,k.c];const q=part*3, j=Math.min(2,Math.floor(q)),u=q-j;
        const p=pts[j]+(pts[j+1]-pts[j])*u + Math.sin(mf*40)*(hi-lo)*0.003;
        h=Math.max(h,p,k.o);l=Math.min(l,p,k.o);c=p;
      }
    }
    if(h<-1e8){h=l=c=o}
    out.push({o,h,l,c,live:(s+BIN>mf)});
  }
  return out;
}
function drawChart(mf,alpha){
  ctx.clearRect(0,0,1080,860); if(alpha<=0)return;
  ctx.globalAlpha=alpha;
  // grid
  ctx.font='500 22px "Plex Mono"';ctx.textAlign='left';ctx.textBaseline='middle';
  for(let p=PMIN+STEP;p<PMAX;p+=STEP){const y=yOf(p);ctx.strokeStyle='rgba(0,0,0,.07)';ctx.lineWidth=1;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R+20,y);ctx.stroke();ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillText(p.toFixed(0),R+34,y)}
  // time labels
  ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.38)';
  [10,11,12,13,14,15].map(h=>[h*60-T0,h+':00']).filter(([m])=>m>0&&m<N).forEach(([m,s])=>{const x=L+(m/BIN)*SP;ctx.fillText(s,x,BOT+42)});
  const cs=candlesAt(mf); if(!cs.length){ctx.globalAlpha=1;return}
  const last=cs[cs.length-1].c, ref=REF;
  // reference line at 9:17 open
  if(mf>0.2){
    const yr=yOf(ref),yl=yOf(last), xs=L;
    const g=ctx.createLinearGradient(0,yr,0,yl);g.addColorStop(0,'rgba(224,47,68,0.02)');g.addColorStop(1,'rgba(224,47,68,0.16)');
    ctx.fillStyle=g;ctx.fillRect(xs,yr,R+20-xs,yl-yr);
    ctx.strokeStyle='rgba(16,17,20,.55)';ctx.setLineDash([6,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xs,yr);ctx.lineTo(R+20,yr);ctx.stroke();ctx.setLineDash([]);
    ctx.font='500 21px "Plex Mono"';ctx.fillStyle='#101114';ctx.textAlign='right';ctx.fillText(D.first_time+' OPEN · ₹'+fmt(REF),R+10,yr-22);
  }
  // candles
  cs.forEach((k,i)=>{
    const x=L+i*SP+SP/2, up=k.c>=k.o, col=up?'#0e9f6e':'#e02f44';
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.4;
    if(k.live){ctx.shadowColor=col;ctx.shadowBlur=18}else ctx.shadowBlur=0;
    ctx.beginPath();ctx.moveTo(x,yOf(k.h));ctx.lineTo(x,yOf(k.l));ctx.stroke();
    const y1=yOf(Math.max(k.o,k.c)),y2=yOf(Math.min(k.o,k.c));ctx.fillRect(x-BW/2,y1,BW,Math.max(2,y2-y1));
  });
  ctx.shadowBlur=0;
  // last price line + tag
  const yl=yOf(last);ctx.strokeStyle='rgba(224,47,68,.7)';ctx.setLineDash([2,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,yl);ctx.lineTo(R+20,yl);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#e02f44';ctx.beginPath();ctx.roundRect(R+22,yl-24,134,48,8);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='600 25px "Plex Mono"';ctx.textAlign='center';ctx.fillText(fmt(last),R+89,yl+1);
  ctx.globalAlpha=1;
  return last;
}
// grain
const gc=$('grain'),gx=gc.getContext('2d');
function grain(f){const im=gx.createImageData(540,960);let s=f*9301+49297;for(let i=0;i<im.data.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;const v=s>>23;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}gx.putImageData(im,0,0)}
// ---------- timeline ----------
const TOTAL=28.2;
function setup(){
  const kind=D.kind;
  $('h1').textContent=D.weekday+' · '+D.date_label;
  $('h2').innerHTML='One at-the-money '+kind+'.<br>One <em>quiet</em> clock.';
  $('inst').innerHTML='NIFTY <span>'+D.strike+'</span> '+D.side;
  $('sub').textContent='WEEKLY · EXPIRY '+D.expiry_label+' · NSE';
  $('fromto').innerHTML='<span class="a">₹'+fmt(D.open)+'</span><span class="arrow">→</span><span>₹'+fmt(D.last)+'</span>';
  const c=D.nifty_chg, sgn=c>=0?'+':'−', lvl=D.nifty_close.toLocaleString('en-IN',{maximumFractionDigits:0});
  const RED='#e02f44',GRN='#0e9f6e',INK='#101114';
  let col,k,t,sub,flip=false;
  if(Math.abs(c)<0.4){col=INK;k='NIFTY '+sgn+Math.abs(c).toFixed(2)+'% · '+lvl;t='Time took<br><em>charge.</em>';sub='The market barely moved. The premium did.'}
  else if(c>0){col=GRN;k='NIFTY '+sgn+Math.abs(c).toFixed(2)+'% · '+lvl;t='Bulls took<br><em>charge.</em>';sub=kind==='put'?'And put buyers paid the price.':'Yet the call still bled.'}
  else {col=RED;flip=true;k='NIFTY '+sgn+Math.abs(c).toFixed(2)+'% · '+lvl;t='Bears took<br><em>charge.</em>';sub=kind==='call'?'And call buyers paid the price.':'Yet the put still bled.'}
  $('bk').textContent=k;$('bk').style.color=col;$('bt').innerHTML=t;$('bt').querySelector('em').style.color=col;$('bs').textContent=sub;
  ['bpath','bhead'].forEach(i=>$(i).setAttribute('stroke',col));
  if(flip)$('barrow').style.transform='translateY(540px) scaleY(-1)';
  const rgb=col===GRN?'14,159,110':col===RED?'224,47,68':'16,17,20';
  $('bwash').style.background=`linear-gradient(0deg,rgba(${rgb},.20) 0%,rgba(${rgb},.05) 45%,rgba(251,250,247,0) 75%)`;
  const dt=new Date(D.date_iso+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  $('disc').textContent='Educational illustration of option time decay on '+dt+', from NSE one-minute price data. Not investment advice or a recommendation to buy or sell any security or strategy. 9 out of 10 individual traders in equity F&O incurred net losses (SEBI study). Derivatives carry substantial risk of loss; past price movement does not indicate future results. Mutual fund investments are subject to market risks, read all scheme related documents carefully. AMFI-registered Mutual Fund Distributor · ARN-359084.';
}
const CH_A=3.0,CH_B=14.2; // chart playback window
const BA=14.4,BL=3.2;
function renderFrame(T){
  if(!window._setup){setup();window._setup=1}
  let t=T<BA?T:(T<BA+BL?BA:T-BL);
  const bu=T-BA, bv=(T>=BA-0.3&&T<BA+BL)?Math.min(eout((T-BA+0.3)/0.5),eout((BA+BL-T)/0.5)):0;
  $('bull').style.opacity=bv;$('bull').style.visibility=bv>0?'visible':'hidden';
  const len=1800,dp=cl(bu/1.1);$('bpath').style.strokeDasharray=len;$('bpath').style.strokeDashoffset=len*(1-eout(dp));$('bhead').style.opacity=bu>1.0?1:0;
  set('bk',win(T,BA+0.2,BA+BL,.4,.4),(1-eout((bu-0.2)/.6))*20);
  set('bt',win(T,BA+0.4,BA+BL,.4,.4),(1-eout((bu-0.4)/.6))*30,0.94+0.06*eout((bu-0.4)/.6));
  set('bs',win(T,BA+1.1,BA+BL,.4,.4),(1-eout((bu-1.1)/.6))*20);
  $('chartwrap').style.opacity=1-bv*0.85;$('hdr').dataset.b=bv;

  // hook
  set('h1',win(t,0.3,2.9,.6,.4),(1-eout((t-.3)/.8))*20);
  set('h2',win(t,0.8,2.9,.7,.4),(1-eout((t-.8)/.9))*30);
  // wordmark: visible throughout except end card
  set('wm',win(t,0.0,21.4,.6,.5));
  // chart scene
  const sc=win(t,2.8,15.0,.6,.0);
  const blurOut=t>14.4?cl((t-14.4)/0.8)*14:0;
  const mf=cl((t-CH_A)/(CH_B-CH_A))*(N-1);
  const eased=(N-1)*(()=>{const u=cl((t-CH_A)/(CH_B-CH_A));return u<.06?u*u/0.12: u- 0.03})();
  const m=Math.max(0,Math.min(N-1,eased));
  const chartVis=t<18.2?Math.min(sc>0?1:0,1)*(t<2.8?0:eout((t-2.8)/.7)):0;
  const fadeOut=t>17.6?1-cl((t-17.6)/.6):1;
  set('hdr',chartVis*fadeOut*(1-bv),(1-eout((t-2.8)/.8))*24,1,blurOut);
  set('px',chartVis*fadeOut*(1-bv),(1-eout((t-3.0)/.8))*24,1,blurOut);
  const push=1+0.035*cl((t-CH_A)/(CH_B-CH_A));
  $('chartwrap').style.transform=`scale(${push})`;$('chartwrap').style.filter=blurOut?`blur(${blurOut}px)`:'none';
  const last=drawChart(t<CH_A?0:m, chartVis*fadeOut);
  const price=last??REF;
  $('pxv').textContent='₹'+fmt(price);
  const d=price-REF;$('pxc').textContent=(m<1?'LIVE · '+D.first_time+' OPEN':((d<0?'−':'+')+fmt(Math.abs(d))+' · '+(d<0?'−':'+')+(Math.abs(d)/REF*100).toFixed(1)+'% since '+D.first_time));
  $('pxv').style.color=m<1?'#101114':(d<0?'#e02f44':'#0e9f6e');
  const mins=T0+Math.round(m);$('clk').textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
  // annotations under chart
  const ann=$('ann');
  if(t>=4.2&&t<8.6){ann.textContent='At the open, premium is at its richest.';set('ann',win(t,4.2,8.6,.5,.5))}
  else if(t>=8.8&&t<13.6){ann.textContent='Then, minute by minute, time takes its cut.';set('ann',win(t,8.8,13.6,.5,.5))}
  else set('ann',0);
  $('ann').style.filter=blurOut?`blur(${blurOut}px)`:'none';
  // reveal
  $('dim').style.opacity=cl((t-14.4)/0.8)*0.92;
  const rv=win(t,14.9,18.0,.5,.45);
  set('rev',rv,(1-eout((t-14.9)/.7))*30,0.96+0.04*eout((t-14.9)/.9));
  const cnt=Math.round(D.drop_pct*eout((t-15.0)/1.4));$('big').textContent='−'+cnt+'%';
  set('fromto',win(t,15.8,18.0,.5,.45));set('dur',win(t,16.4,18.0,.5,.45));
  // lines
  set('l1',win(t,18.2,21.4,.5,.4),(1-eout((t-18.2)/.7))*24);
  set('l2',win(t,19.0,21.4,.5,.4),(1-eout((t-19.0)/.7))*24);
  set('l3',win(t,19.9,21.4,.5,.4),(1-eout((t-19.9)/.7))*18);
  // end
  const ev=win(t,21.6,99,.7,0);
  set('end',ev,(1-eout((t-21.6)/.9))*24);
  $('endrule').style.width=(eout((t-22.1)/1.0)*360)+'px';
  set('endtag',win(t,22.4,99,.6,0));set('endcta',win(t,23.0,99,.6,0));
  set('disc',win(t,21.9,99,.6,0));
}
window.renderFrame=renderFrame;window.TOTAL=TOTAL;
</script></body></html>
